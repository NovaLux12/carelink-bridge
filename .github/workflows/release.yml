name: Release

# A tag push is the moment a claim becomes public, and until this workflow
# existed it was the one moment nothing checked. `ci.yml` triggers on
# `branches: [main]` only, so tagging ran no workflow at all: the release object
# was a hand-typed string pointing at a commit nothing re-verified.
#
# This does not build or publish an artefact — docker.yml publishes the image,
# and there is no npm package (the manifest is `private`). What this does is
# verify the release and create it, which is where every historical version
# failed: v0.3.0 was marked shipped with a date while no tag existed and
# `package.json` still read 0.2.0.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the ancestry check below needs to know whether this
          # commit is on main, which a shallow clone cannot answer.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # --- The checks, in order of what they would have caught -------------

      - name: Tag name is a semver version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$GITHUB_REF_NAME' is not vX.Y.Z"
            exit 1
          fi

      # The one check that would have caught every historical drift.
      - name: package.json, package-lock.json and the tag all agree
        run: |
          echo "tag=${GITHUB_REF_NAME#v}"
          node scripts/check-version-sync.mjs --tag "$GITHUB_REF_NAME"

      # A release must be cut from something that actually landed. Tagging a
      # side branch publishes a commit no PR ever reviewed.
      - name: Tag commit is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not an ancestor of main"
            exit 1
          fi

      # A CHANGELOG section for this version must exist. This is what stops a
      # release body being invented at publish time.
      - name: CHANGELOG has a section for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${TAG}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section"
            exit 1
          fi
          # The section must not be empty prose.
          BODY=$(awk -v v="$TAG" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md | grep -cvE '^\s*$' || true)
          if [ "$BODY" -lt 3 ]; then
            echo "::error::CHANGELOG section for $TAG has $BODY non-empty lines; write the entry before tagging"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The artefact this tag claims to ship. `npm run build` exiting 0 does not
      # prove dist/ holds the entrypoints the Dockerfile and systemd unit
      # execute — measured 2026-11-16, three entrypoints can be missing and
      # every other step stays green.
      - name: dist/ contains the entrypoints the tag ships
        run: node scripts/verify-dist.mjs

      # --- Publish ---------------------------------------------------------

      - name: Extract the CHANGELOG section as release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          wc -l "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
