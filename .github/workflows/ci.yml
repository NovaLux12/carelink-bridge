name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the tree. Explicit rather than
# relying on the repo default, so a change to that default cannot silently
# widen what a PR run can do.
permissions:
  contents: read

# One run per ref. Without this, every push to a PR branch started a full
# duplicate 2-node matrix (v0.3.1's branch ran three times in twelve minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 22 and 24. Node 20 was dropped because puppeteer-core@25 (a RUNTIME
        # dependency, eagerly imported by src/login.ts via src/main.ts) declares
        # engines.node >=22.12.0 — so advertising Node 20 support was a false
        # claim, and `npm ci --engine-strict` hard-fails there. Node 20 also went
        # EOL 2026-04-30.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The artefact operators actually run. `tsc --noEmit` proves the types;
      # only `npm run build` proves dist/ exists and that the Dockerfile and
      # systemd unit have something to execute.
      - run: npm run build
      # ...and only this proves the build emitted the entrypoints those two
      # consumers name. Measured 2026-11-16: deleting dist/main.js,
      # dist/doctor.js and dist/login.js after a successful `npm run build` left
      # typecheck, test and bundle ALL GREEN, because the tests import src/ and
      # the bundle is built from src/ by esbuild. Nothing read dist/ at all.
      # RED IF: an entrypoint is missing/empty, a dist/*.js path named by
      # package.json, the systemd unit or the Dockerfile does not resolve, or
      # dist/main.js cannot load its own module graph (ERR_MODULE_NOT_FOUND).
      - name: dist/ contains the entrypoints the Dockerfile and systemd unit run
        run: node scripts/verify-dist.mjs
      # The single-file bundle (issue #143, ADR 0009). Only `npm run bundle`
      # proves the artefact a user would actually run loads: it rebuilds with
      # puppeteer inlined and then EXECUTES the output, failing on the two
      # traps that produce a bundle which builds cleanly and dies at startup
      # (a missing createRequire banner, and a colliding one). tsc cannot see
      # either, which is why this is a separate step rather than part of build.
      #
      # Falsified 2026-11-16 rather than assumed: an un-namespaced banner gives
      # exit 1 on SyntaxError, and building from src/main.ts gives exit 1 on the
      # missing `doctor` subcommand. Both are red, not silent.
      - run: npm run bundle
      # Version drift guard. CONTRIBUTING step 1 (bump package.json, then
      # `npm install --package-lock-only`) is load-bearing and unguarded: `npm ci`
      # catches DEPENDENCY drift, not the package's own version, so a bump that
      # skipped the lockfile sync passed CI silently. This is the same class of
      # bug that hit v0.1.1 and v0.1.2.
      #
      # It reads BOTH places npm writes the version plus the dependency range
      # maps. The previous inline two-value comparison was bypassable: setting
      # lock `packages[""].version` (the field npm's resolver reads) to a stale
      # value left it green, and widening a range (`qs: ^6.17.1` -> `^6.0.0`)
      # left it green while `npm ci` also passed. Both measured 2026-11-16.
      # RED IF: any of version / packages[""] / name / dependency or
      # devDependency ranges / engines.node disagree between the two files.
      - name: package.json and package-lock.json agree (version + dependency ranges)
        run: node scripts/check-version-sync.mjs

  # macOS is a SUPPORTED host (deploy/README.md, USER-GUIDE.md) and, until
  # 2026-11-15, completely untested in CI. That gap shipped a real bug.
  #
  # writeLoginDataAtomic hardcoded the LINUX numeric values of O_CREAT / O_EXCL
  # (64 / 128). On macOS they are 512 / 2048, so `open()` got no valid create
  # flag and returned ENOENT against a perfectly writable directory. The whole
  # OAuth login succeeded and the token could not be saved — and every test
  # passed, because the Linux values are correct on the Linux runner.
  #
  # One job, one Node version, POSIX-only. It is not a second full matrix: the
  # point is to exercise platform-specific syscalls, and Node version is
  # orthogonal to that. The suite has explicit win32 guards, so it runs clean
  # here without pretending to cover Windows.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Build AND exercise the artefact on a non-Linux host. `tsc` emitting the
      # same files everywhere is not the claim that matters: the daemon's module
      # graph resolving on macOS is, and that is where the O_CREAT/O_EXCL bug
      # shipped from. Cheap (one build, one process) next to npm ci.
      # RED IF: dist/ is missing an entrypoint, or dist/main.js fails to load
      # its module graph on macOS (the exact class of the atomic-write bug).
      - run: npm run build
      - name: Built artefact loads on macOS
        run: node scripts/verify-dist.mjs
      # The atomic-write path is the entire reason this job exists, so name it
      # in the log rather than relying on it being somewhere in the suite.
      - name: Platform-specific syscalls (the reason this job exists)
        run: npx vitest run test/atomic-write.test.ts

  # The Dockerfile is BUILT by docker.yml at tag time and was never EXERCISED
  # anywhere. That is how a published image shipped with `npm run doctor`
  # exiting 127 (`sh: 1: tsx: not found` — tsx is a devDependency and the
  # runtime stage runs `npm ci --omit=dev`). The pipeline verified the image
  # was built, not that it worked.
  #
  # Builds the image with the local Docker daemon (no registry, no secrets) and
  # runs scripts/verify-image.sh inside it. ~1-2 min on a warm GHA cache; the
  # no-cache build measured 21s locally.
  # RED IF: any of — dist/ missing from the image, `node dist/doctor.js` or
  # `npm run doctor:dist` not reaching the config row, the CMD entrypoint not
  # loading, tsx appearing in node_modules/.bin, the image running as root, or
  # the HEALTHCHECK being removed. Every one of those was falsified locally on
  # 2026-11-16 and observed red.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t carelink-bridge:ci .
      - name: Exercise the image (doctor, doctor:dist, CMD, non-root)
        run: bash scripts/verify-image.sh carelink-bridge:ci

  cross-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every vendor claim in this repo cites NovaLux12/carelink-api-research.
    # Those links float on `main`, so a rename on that side would silently
    # 404 them. This makes the breakage loud at PR time.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run links:check -- --online
